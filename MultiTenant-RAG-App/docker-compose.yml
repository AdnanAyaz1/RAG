version: '3.8'

services:
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    ports:
      - '1521:1521'
    environment:
      ORACLE_PDB: XEPDB1
      ORACLE_PWD: SecurePassword123
      APP_USER: rag_app
      APP_USER_PWD: ragapppassword123
    volumes:
      - oracle-data:/opt/oracle/oradata
      - oracle-backup:/opt/oracle/backup
    healthcheck:
      test: ["CMD", "sqlplus", "-L", "app_user/ragapppassword123@localhost:1521/XEPDB1", "-c", "SELECT 1 FROM DUAL;"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  rag-service:
    build: ./rag-service
    ports:
      - '8000:8000'
    depends_on:
      oracle-db:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      DATABASE_URL: oracle://app_user:ragapppassword123@oracle-db:1521/XEPDB1
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: rag-documents
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OLLAMA_URL: http://ollama:11434
      LOG_LEVEL: INFO
    volumes:
      - rag-storage:/app/uploads
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.9
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - '3000:3000'
    depends_on:
      oracle-db:
        condition: service_healthy
      rag-service:
        condition: service_started
      redis:
        condition: service_started
    environment:
      DATABASE_URL: oracle://app_user:ragapppassword123@oracle-db:1521/XEPDB1
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      RAG_SERVICE_URL: http://rag-service:8000
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: rag-documents
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PORT: 3000
      NODE_ENV: development
      LOG_LEVEL: DEBUG
    volumes:
      - backend-uploads:/app/uploads
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - '11434:11434'
    volumes:
      - ollama-data:/root/.ollama
    depends_on:
      - oracle-db
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - '3001:3000'
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_RAG_URL: http://localhost:8000
    restart: unless-stopped

volumes:
  oracle-data:
  oracle-backup:
  qdrant-data:
  rag-storage:
  backend-uploads:
  redis-data:
  ollama-data:
  minio-data: