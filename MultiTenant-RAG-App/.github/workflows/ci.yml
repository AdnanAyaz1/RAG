name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, rag-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        if: matrix.service != 'rag-service'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Python
        if: matrix.service == 'rag-service'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Lint ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          npm ci
          npm run lint

  test:
    runs-on: ubuntu-latest
    services:
      oracle-db:
        image: gvenzl/oracle-xe:21-slim
        env:
          ORACLE_PDB: XEPDB1
          ORACLE_PWD: testpassword123
          APP_USER: test_user
          APP_USER_PWD: testpassword123
        ports:
          - 1521:1521
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      qdrant:
        image: qdrant/qdrant:v1.9
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - name: Run backend tests
        run: |
          cd backend
          npm ci
          npm run test
      - name: Run rag-service tests
        run: |
          cd rag-service
          pip install -r requirements.txt
          pytest

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend
        run: docker build -t rag-backend:latest ./backend
      - name: Build rag-service
        run: docker build -t rag-service:latest ./rag-service
      - name: Build frontend
        run: docker build -t rag-frontend:latest ./frontend